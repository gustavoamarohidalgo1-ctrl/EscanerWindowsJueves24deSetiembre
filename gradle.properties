org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.builder.sdkDownload=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.13 integra referencias de código y recursos en un mismo grafo de R8. Esto permite
# descartar recursos alcanzables únicamente desde código que R8 ya eliminó.
android.r8.optimizedResourceShrinking=true
# Conserva JSON y trazas Perfetto producidos por Macrobenchmark fuera del dispositivo.
android.enableAdditionalTestOutput=true
