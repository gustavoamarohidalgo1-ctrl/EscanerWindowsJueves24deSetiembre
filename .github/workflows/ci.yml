name: CI

on:
  pull_request:
  push:
    branches: [main, windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas y política de esquema Room
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Historial de esquemas Room (solo se agregan versiones)
        env:
          ROOM_SCHEMA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify-room-schema-history.sh "$ROOM_SCHEMA_BASE"
      - name: Búsqueda de secretos
        run: ruby scripts/scan-repository-secrets.rb
      - name: Pruebas
        run: ./gradlew --no-daemon :app:test
      - name: Resultados de pruebas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: resultados-pruebas
          path: app/build/reports/tests/test
          if-no-files-found: ignore

  windows-installer:
    name: Instalador de Windows (MSI)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Pruebas en Windows
        run: ./gradlew --no-daemon :app:test
      - name: Construir instalador MSI
        run: ./gradlew --no-daemon :app:packageReleaseMsi
      - name: Publicar instalador
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: FacturaStock-Windows-MSI
          path: app/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
